services:
  db:
    image: mysql:8.4
    container_name: libtrack-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-libtrack}
      MYSQL_USER: ${MYSQL_USER:-libtrack}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in your ignored .env file}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in your ignored .env file}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - libtrack-mysql-data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - 'MYSQL_PWD="$${MYSQL_ROOT_PASSWORD}" mysqladmin ping -h 127.0.0.1 -uroot --silent'
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  libtrack-mysql-data:
