services:
  db:
    image: postgres:17-alpine
    container_name: libtrack-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-libtrack}
      POSTGRES_USER: ${POSTGRES_USER:-libtrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-libtrack}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - libtrack-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-libtrack} -d ${POSTGRES_DB:-libtrack}"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  libtrack-postgres-data:
