spring:
  application:
    name: libtrack
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/libtrack}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration/mysql}
  servlet:
    multipart:
      max-file-size: ${LIBTRACK_MAX_FILE_SIZE:25MB}
      max-request-size: ${LIBTRACK_MAX_REQUEST_SIZE:30MB}
server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: ${SESSION_TIMEOUT:30m}
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
libtrack:
  registration:
    verification-token-ttl: ${LIBTRACK_VERIFICATION_TOKEN_TTL:PT24H}
    frontend-base-url: ${LIBTRACK_FRONTEND_BASE_URL:http://localhost:4200}
  # Set this to the library's actual IANA zone for server-generated local dates.
  library-zone: ${LIBTRACK_LIBRARY_ZONE:UTC}
  storage:
    digital-books-dir: ${LIBTRACK_STORAGE_DIR:./storage/digital-books}
  digital-edition:
    max-file-size: ${LIBTRACK_MAX_FILE_SIZE:25MB}
resend:
  api-key: ${RESEND_API_KEY:}
  from-email: ${RESEND_FROM_EMAIL:onboarding@resend.dev}
