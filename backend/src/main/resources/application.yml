spring:
  application:
    name: libtrack
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/libtrack}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration/mysql}
server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: ${SESSION_TIMEOUT:30m}
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
libtrack:
  # Set this to the library's actual IANA zone for server-generated local dates.
  library-zone: ${LIBTRACK_LIBRARY_ZONE:UTC}
