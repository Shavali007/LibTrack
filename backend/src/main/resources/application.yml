spring:
  application:
    name: libtrack
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/libtrack}
    username: ${DB_USERNAME:libtrack}
    password: ${DB_PASSWORD:libtrack}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: ${SESSION_TIMEOUT:30m}
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
libtrack:
  # Set this to the library's actual IANA zone for server-generated local dates.
  library-zone: ${LIBTRACK_LIBRARY_ZONE:UTC}
